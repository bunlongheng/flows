name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: flows
          # Trust auth: no password, so nothing credential-shaped is committed.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Non-secret e2e boot config. NOTE: NODE_ENV is intentionally NOT set to
      # production here - that would make `npm ci` skip devDependencies (vitest,
      # playwright). The `npm run start` script sets NODE_ENV=production itself
      # for the server process, so the local auth bypass is still gated OFF and
      # the e2e specs exercise the real Bearer/owner gates.
      DATABASE_URL: postgres://postgres@localhost:5432/flows
      DATABASE_SSL: "false"
      OWNER_USER_ID: 00000000-0000-0000-0000-000000000001
      FLOWS_APP_URL: https://flows-bheng.vercel.app
      # Non-secret auth config so /api/health reports ok:true (the webServer
      # readiness probe). Google OAuth is never actually called in e2e - the
      # specs exercise unauthenticated/Bearer paths only.
      GOOGLE_CLIENT_ID: e2e-dummy-client-id
      OWNER_EMAIL: owner@example.com

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Throwaway secrets, generated fresh each run - never real credentials.
      - name: Generate throwaway e2e secrets
        run: |
          {
            echo "FLOWS_API_SECRET=e2e-$(openssl rand -hex 16)"
            echo "AUTH_SECRET=e2e-$(openssl rand -hex 16)"
            echo "GOOGLE_CLIENT_SECRET=e2e-$(openssl rand -hex 8)"
          } >> "$GITHUB_ENV"

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:coverage

      - name: Apply database migrations
        run: npm run migrate

      # Browser binaries are cached by lockfile; only the apt libs are reinstalled on a hit.
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: E2E (API + browser render, against a production build)
        run: npm run test:e2e
